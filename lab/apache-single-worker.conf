# Single-worker override for the php2shell lab baseline.
#
# Mounted by lab/start_target.sh --single. The default target keeps the image's own prefork
# configuration (StartServers 5 / MaxRequestWorkers 150), where the chain has to occupy
# MaxRequestWorkers-1 children instead. This file is a lab convenience, not a target requirement.
#
# Files in conf-enabled are read after mods-enabled, so these values win over mpm_prefork.conf.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
