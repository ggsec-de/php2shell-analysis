server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # nginx defaults to 1 MiB of request body, which is *below* the arming request (about 1.01 MiB) and
    # answers 413 before PHP ever sees it. On a real FPM deployment this default is therefore a partial
    # mitigation against this chain by accident, and raising it is a prerequisite for the lab.
    client_max_body_size 64m;
    client_body_buffer_size 1m;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass fpm:9000;
        # No keepalive to the backend on purpose: on a real pool this is why a missed pin is invisible.
        fastcgi_read_timeout 300;
    }
}
