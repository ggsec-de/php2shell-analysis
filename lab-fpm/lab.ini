; php2shell FPM lab overrides, mounted as a conf.d fragment so it wins over the copied php.ini.
;
; These mirror the Apache arm: the chain needs a tight-but-not-too-tight 128M budget (the arming OOM
; has to land on the encoder's one-page allocation, not earlier), upload-progress cleanup on, and
; display_errors off so the failure is invisible in the response - exactly like a production host.

memory_limit=128M
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/proc/self/fd/2

post_max_size=8M
upload_max_filesize=8M
max_file_uploads=20

session.upload_progress.enabled=1
session.upload_progress.cleanup=On
session.upload_progress.freq=1%
session.save_path=/tmp/sessions
session.serialize_handler=php
session.use_strict_mode=0
session.use_only_cookies=1
