; One static worker: the whole point is that consecutive requests are served by the same process, so a
; "same PID" observation means something. pm.max_requests = 0 disables recycling between the steps -
; with a non-zero value the worker could be replaced between A1 and B1, and the chain would fail for a
; reason that has nothing to do with the vulnerability.
[www]
user = www-data
group = www-data
listen = 9000

pm = static
pm.max_children = 1
pm.max_requests = 0

request_terminate_timeout = 0
catch_workers_output = yes
